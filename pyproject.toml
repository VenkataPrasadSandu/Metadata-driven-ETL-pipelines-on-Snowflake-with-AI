[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowflake-ai-metadata-etl"
version = "0.1.0"
description = "Metadata-driven ETL pipelines on Snowflake with AI assistance"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
